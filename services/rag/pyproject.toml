[project]
name = "corag-rag"
version = "0.1.0"
description = "CO-RAG: RAG Service (gRPC) — эмбеддинги Jina, поиск pgvector, ответ LLM"
requires-python = ">=3.12,<3.13"
dependencies = [
    "corag-contracts",
    "corag-db",
    "einops>=0.8",
    "grpcio>=1.85.1",
    "grpcio-health-checking>=1.85.1",
    "grpcio-reflection>=1.85.1",
    "httpx>=0.28.1",
    "numpy>=2.5",
    "pydantic-settings>=2.15.0",
    "torch==2.6.0",
    "transformers==4.46.3",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
corag-db = { workspace = true }
corag-contracts = { workspace = true }
