[project]
name = "corag-contracts"
version = "0.1.0"
description = "CO-RAG: общие контракты сервисов — JWT, сообщения RabbitMQ, gRPC"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14.0",
    "pyjwt>=2.15.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
