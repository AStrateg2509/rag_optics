[project]
name = "corag-db"
version = "0.1.0"
description = "CO-RAG: ORM-модели, асинхронная сессия, репозитории и сид PostgreSQL + pgvector"
requires-python = ">=3.12,<3.13"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.54,<2.1",
    "asyncpg>=0.31,<0.33",
    "pgvector>=0.5,<0.6",
    "pydantic-settings>=2.15",
    "bcrypt>=5.0",
    "numpy>=2.5",
    "alembic>=1.20",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
