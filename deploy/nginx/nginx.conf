# Nginx — reverse proxy CO-RAG (доп. задание ЛР2).
#   /       — статика (deploy/nginx/static)
#   /api/   — API Service; префикс /api срезается: /api/issues → http://api/issues
#   /ws     — Notification Service (ЛР4), пока закомментирован
# В ЛР2 API запущен в WSL, а не в контейнере: адрес хоста — host.docker.internal.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    log_format main '$remote_addr "$request" $status $body_bytes_sent '
                    'upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout main;

    upstream api {
        server host.docker.internal:8000;
    }

    server {
        listen 80;
        server_name _;

        # Скан выпуска до 200 МБ (MAX_SCAN_MB) + накладные расходы multipart.
        # Без этой строки Nginx отвечает 413 уже на 1 МБ (значение по умолчанию)
        client_max_body_size 210m;

        location / {
            root  /usr/share/nginx/html;
            index index.html;
        }

        location /api/ {
            proxy_pass http://api/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Тело запроса передаётся API сразу, без буферизации на диске Nginx
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }

        # ЛР4: WebSocket Notification Service
        # location /ws {
        #     proxy_pass http://notification:8001;
        #     proxy_http_version 1.1;
        #     proxy_set_header Upgrade    $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        #     proxy_set_header Host       $host;
        #     proxy_read_timeout 3600s;
        # }
    }
}
