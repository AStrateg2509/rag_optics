[project]
name = "co-rag"
version = "0.1.0"
description = "CO-RAG: RAG-ассистент по архиву журнала «Компьютерная оптика»"
requires-python = ">=3.12,<3.13"
dependencies = ["corag-db"]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "pymupdf>=1.26",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*", "tools/*"]

[tool.uv.sources]
corag-db = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
