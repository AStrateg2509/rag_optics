[project]
name = "co-rag"
version = "0.1.0"
description = "CO-RAG: RAG-ассистент по архиву журнала «Компьютерная оптика»"
requires-python = ">=3.12,<3.13"
dependencies = [
    "corag-api",
    "corag-contracts",
    "corag-db",
    "corag-rag",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "pymupdf>=1.26",
    "httpx>=0.28.1",
    "grpcio-tools>=1.85.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*", "tools/*"]

[tool.uv.sources]
corag-db = { workspace = true }
corag-api = { workspace = true }
corag-contracts = { workspace = true }
corag-rag = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
# Сгенерированный protobuf/gRPC-код (scripts/gen_proto.sh) не проверяем и не форматируем
extend-exclude = ["packages/corag-contracts/src/corag_contracts/rag/v1"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["corag_api", "corag_contracts", "corag_db", "corag_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib: одинаковые имена файлов в разных каталогах (tests/db и tests/api) не конфликтуют.
# Тесты с настоящими моделями (slow) по умолчанию пропускаются: uv run pytest -m slow
addopts = "--import-mode=importlib -m 'not slow'"
markers = ["slow: тест с настоящей моделью (скачивание весов, минуты на CPU)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
